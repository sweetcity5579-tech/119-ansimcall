<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>119안심콜 통계 관리</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f6f7fa;color:#233047;margin:0;padding:40px 18px}.wrap{max-width:750px;margin:auto}h1{margin-bottom:10px}.muted{color:#6c7786}.bar{display:flex;gap:10px;margin:25px 0}input{padding:13px;border:1px solid #cdd2db;border-radius:9px;flex:1;min-width:0}button{background:#d93449;color:white;border:0;border-radius:9px;padding:12px 20px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 20px #15233d0a}.card b{display:block;font-size:36px;margin-top:12px;color:#d93449}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>119안심콜 홍보 통계</h1><p class="muted">서버에 누적된 방문 이벤트와 가입 버튼 클릭 이벤트입니다. 실제 가입 완료 수와 다릅니다.</p><div class="bar"><input type="password" id="token" placeholder="관리자 비밀번호" autocomplete="off"><button id="load">조회</button></div><p id="status" role="status"></p><section class="card" style="margin:18px 0"><h2 style="margin-top:0">관리자 비밀번호 변경</h2><p class="muted">현재 비밀번호를 입력한 뒤 새 비밀번호를 설정하세요 (12자 이상).</p><div style="display:grid;gap:10px"><input type="password" id="oldpw" placeholder="현재 비밀번호" autocomplete="current-password"><input type="password" id="newpw" placeholder="새 비밀번호 (12자 이상)" autocomplete="new-password"><input type="password" id="confirm" placeholder="새 비밀번호 확인" autocomplete="new-password"><button id="change">비밀번호 변경</button></div><p id="change-status" role="status"></p></section><div class="grid"><div class="card">누적 방문 수<b id="visits">—</b></div><div class="card">누적 가입 버튼 클릭 수<b id="clicks">—</b></div><div class="card">오늘 방문 수<b id="today_visits">—</b></div><div class="card">오늘 가입 버튼 클릭 수<b id="today_clicks">—</b></div></div><p class="muted">기준: 한국시간(KST). 방문 수는 순 방문자 수가 아닌 페이지 접속 이벤트 수입니다.</p></div><script>document.getElementById('load').onclick=async()=>{let s=document.getElementById('status');try{let r=await fetch('/api/stats',{headers:{'X-Admin-Token':document.getElementById('token').value},cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(d.error||'조회 실패');for(let k of ['visits','clicks','today_visits','today_clicks'])document.getElementById(k).textContent=d[k].toLocaleString('ko-KR');s.textContent='조회 완료'}catch(e){s.textContent=e.message}};document.getElementById('change').onclick=async()=>{const status=document.getElementById('change-status'),old=document.getElementById('oldpw').value,n=document.getElementById('newpw').value,confirm=document.getElementById('confirm').value;if(n!==confirm){status.textContent='새 비밀번호가 일치하지 않습니다.';return}if(n.length<12){status.textContent='새 비밀번호는 12자 이상이어야 합니다.';return}try{const r=await fetch('/api/admin/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:old,new_password:n})});const d=await r.json();if(!r.ok)throw Error(d.error||'변경 실패');status.textContent=d.message;document.getElementById('token').value='';for(const id of ['oldpw','newpw','confirm'])document.getElementById(id).value=''}catch(e){status.textContent=e.message}};</script></body></html>
